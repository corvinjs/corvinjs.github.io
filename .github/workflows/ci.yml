name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Discover submodules
        id: submodules
        run: |
          paths=""
          key="$(git hash-object .gitmodules)"
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            sha=$(git rev-parse "HEAD:$dir" 2>/dev/null || echo "missing")
            key="${key}:${dir}=${sha}"
            [ -f "$dir/build.sh" ] || continue
            paths="${paths}${dir}/_site"$'\n'
          done < <(git config --file .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}')
          {
            echo "paths<<EOF"
            printf '%s' "$paths"
            echo "EOF"
            echo "key=$(printf '%s' "$key" | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      # Restored ${dir}/_site is read by Jekyll keep_files (assets/downsized) in
      # submodules that generate responsive images during build.
      - name: Cache submodule build outputs
        if: steps.submodules.outputs.paths != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.submodules.outputs.paths }}
          key: submodule-builds-${{ steps.submodules.outputs.key }}
          restore-keys: submodule-builds-

      - name: Build root site
        run: bash build.sh /

      - name: Build changed submodules
        run: |
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            [ -d "$dir" ] || continue
            [ -f "$dir/build.sh" ] || { echo "WARN: $dir/build.sh missing"; continue; }
            prev=$(git diff HEAD~1 HEAD -- "$dir" | grep '^-Subproject commit' | awk '{print $3}')
            curr=$(git diff HEAD~1 HEAD -- "$dir" | grep '^+Subproject commit' | awk '{print $3}')
            if [ -n "$prev" ] && [ "$prev" = "$curr" ]; then
              echo "Skipping $dir (unchanged)"
              continue
            fi
            echo "Building $dir with baseurl=/$dir"
            (cd "$dir" && bash build.sh "/$dir")
          done < <(git config --file .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}')

      - name: Assemble _site
        run: |
          mkdir -p _site_full/
          git rev-parse --short HEAD > "_site_full/COMMIT"
          cp -r _site/. _site_full/
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            [ -d "$dir/_site" ] || { echo "WARN: $dir/_site missing"; continue; }
            mkdir -p "_site_full/$dir"
            cp -r "$dir/_site/." "_site_full/$dir/"
          done < <(git config --file .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}')

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_full

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
