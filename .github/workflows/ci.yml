name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Debug checkout state
        run: |
          echo "=== checkout ==="
          git rev-parse --short HEAD
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            [ -d "$dir" ] || { echo "$dir: MISSING"; continue; }
            sha=$(git rev-parse "HEAD:$dir" 2>/dev/null || echo missing)
            jpg=$(find "$dir/assets" -maxdepth 1 -name '*.jpg' 2>/dev/null | wc -l | tr -d ' ')
            posts=$(find "$dir/_posts" -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
            echo "$dir: gitlink=${sha:0:7} jpg=$jpg posts=$posts build.sh=$([ -f "$dir/build.sh" ] && echo yes || echo no)"
          done < <(git config --file .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}')

      - name: Discover submodules
        id: submodules
        run: |
          paths=""
          key="$(git hash-object .gitmodules)"
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            sha=$(git rev-parse "HEAD:$dir" 2>/dev/null || echo "missing")
            key="${key}:${dir}=${sha}"
            [ -f "$dir/build.sh" ] || continue
            paths="${paths}${dir}/_site"$'\n'
            while IFS= read -r cache_path; do
              [ -n "$cache_path" ] || continue
              paths="${paths}${dir}/${cache_path}"$'\n'
            done < <(bash "$dir/build.sh" cache-paths 2>/dev/null || true)
          done < <(git config --file .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}')
          {
            echo "paths<<EOF"
            printf '%s' "$paths"
            echo "EOF"
            echo "key=$(printf '%s' "$key" | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      # Submodules may declare extra cache dirs via `build.sh cache-paths`
      # (e.g. rhone2024's assets/downsized for incremental image conversion).
      - name: Cache submodule build outputs
        if: steps.submodules.outputs.paths != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.submodules.outputs.paths }}
          key: submodule-builds-${{ steps.submodules.outputs.key }}
          key: submodule-builds-v2-debug-${{ steps.submodules.outputs.key }}
          restore-keys: |
            submodule-builds-v2-debug-
            submodule-builds-

      - name: Debug cache restore state
        run: |
          echo "=== after cache restore ==="
          for dir in rhone2024; do
            [ -d "$dir" ] || continue
            jpg=$(find "$dir/assets" -maxdepth 1 -name '*.jpg' 2>/dev/null | wc -l | tr -d ' ')
            jxl=$(find "$dir/assets/downsized" -maxdepth 1 -name '*.jxl' 2>/dev/null | wc -l | tr -d ' ')
            manifest=$([ -f "$dir/assets/downsized/.manifest.json" ] && wc -c < "$dir/assets/downsized/.manifest.json" | tr -d ' ' || echo 0)
            site_pics=$([ -f "$dir/_site/Jul-05.html" ] && grep -c '<picture>' "$dir/_site/Jul-05.html" || echo 0)
            echo "$dir: jpg=$jpg jxl=$jxl manifest_bytes=$manifest cached_site_pictures_jul05=$site_pics"
          done

      - name: Clear stale rhone2024 outputs (debug rebuild)
        run: rm -rf rhone2024/_site rhone2024/assets/downsized

      - name: Build root site
        run: |
          echo "::group::Root site"
          bash build.sh /
          echo "::endgroup::"

      - name: Build changed submodules
        env:
          FORCE_BUILD_SUBMODULES: rhone2024
        run: |
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            [ -d "$dir" ] || continue
            [ -f "$dir/build.sh" ] || { echo "WARN: $dir/build.sh missing"; continue; }
            prev_sha=$(git rev-parse "HEAD~1:$dir" 2>/dev/null || true)
            curr_sha=$(git rev-parse "HEAD:$dir" 2>/dev/null || true)
            force="${FORCE_BUILD_SUBMODULES:-}"
            if [ "$prev_sha" = "$curr_sha" ] && [ "${force#*$dir}" = "$force" ]; then
              echo "Skip $dir (submodule unchanged at ${curr_sha:0:7})"
              continue
            fi
            if [ "${force#*$dir}" != "$force" ]; then
              echo "Force build $dir (FORCE_BUILD_SUBMODULES)"
            fi
            echo "::group::Build $dir (${prev_sha:0:7} -> ${curr_sha:0:7})"
            (cd "$dir" && bash build.sh "/$dir")
            echo "::endgroup::"
            if [ -f "$dir/_site/Jul-05.html" ]; then
              echo "$dir post-build: pictures=$(grep -c '<picture>' "$dir/_site/Jul-05.html") srcsets=$(grep -c 'srcset=' "$dir/_site/Jul-05.html")"
            fi
          done < <(git config --file .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}')

      - name: Assemble _site
        run: |
          mkdir -p _site_full/
          git rev-parse --short HEAD > "_site_full/COMMIT"
          cp -r _site/. _site_full/
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            [ -d "$dir/_site" ] || { echo "WARN: $dir/_site missing"; continue; }
            mkdir -p "_site_full/$dir"
            cp -r "$dir/_site/." "_site_full/$dir/"
          done < <(git config --file .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}')

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_full

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
