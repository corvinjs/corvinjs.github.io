name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write # delete superseded caches
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Submodules are fetched by build.sh, only for the sites it rebuilds.
      - uses: actions/checkout@v7.0.1

      # _site holds every site's last output; build.sh skips the unchanged ones.
      - uses: actions/cache/restore@v6
        with:
          path: _site
          key: site-${{ github.sha }}
          restore-keys: site-

      - run: bash build.sh

      - uses: actions/cache/save@v6
        with:
          path: _site
          key: site-${{ github.sha }}

      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key site- --json key --jq '.[].key' |
            grep -vx "site-${{ github.sha }}" |
            while read -r key; do gh cache delete "$key"; done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5.0.1
