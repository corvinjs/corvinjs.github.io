<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title>Corvin Sydow</title>
    <link rel="preload" href="/fonts/lmsans10-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/lmsans10-bold.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      /* 1) Font */
      /* Regular (Weight: 400) */
      @font-face {
        font-family: 'LM Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/lmsans10-regular.woff2') format('woff2');
      }

      /* Bold (Weight: 700) */
      @font-face {
        font-family: 'LM Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('fonts/lmsans10-bold.woff2') format('woff2');
      }

      body {
        font-family: 'LM Sans', system-ui, -apple-system, Roboto, Arial, sans-serif;
      }

      /* 2) Accent color */
      :root {
        accent-color: #537c4d;
        --accent: #537c4d;
      }

      ::selection { background: var(--accent); color: #fff; }
      a { color: var(--accent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button, input[type="submit"] {
        background: var(--accent);
        color: #fff;
        border: 0;
        padding: 0.5rem 1rem;
        border-radius: 0; /* already enough AI slop on this domain */
        cursor: pointer;
      }
      button:hover, input[type="submit"]:hover {
        filter: brightness(0.9);
      }

      /* 3) before I forget */
      img { max-width: 100%; }
      body {
          display: flex; flex-direction: column; min-height: 100vh;
          max-width: 960px; margin: 0 auto; padding: 0 10px; /* Linter toetet mich */
          }
    </style>
  </head>
  <body>
    <!-- <header><nav>Corvin Sydow</nav></header> -->
    <main style="flex: 1;">
    <h2 style="font-size: 1.2rem; /* Stay modest */">Corvin Joachim Sydow</h2>
      <div style="width: calc(min(90vw, 90vh, 640px)); margin: 0 auto;">
        <picture>
          <!-- The future is here!! -->
          <source type="image/jxl" srcset="assets/corvin-2026-mvs.jxl">
          <!-- At least for some of us -->
          <img src="assets/corvin-2026-mvs-sm.jpg" title="danke Tina fürs Foto :)">
        </picture>
      </div>
      <p>*2005</p>
      <p>Kontakt: &lt;vorname&gt;<span style="border-radius:50%;border:1px solid currentColor;display:inline-block;width:1em;height:1em;line-height:calc(1em - 4px);text-align:center;font-size:0.8em;vertical-align:middle;utm-source:claude.ai">a</span>sydow.ch</p>
    </main>
    <footer><small style="font-size: 0.7rem; line-height: 1.2; display: block;">Alle Rechte vorbehalten. Es werden keine Statistiken, Logs oder sonstige Informationen über Besucher erfasst. Für Risiken und Nebenwirkungen konsultieren Sie bitten ihren Optiker.</small></footer>
  </body>
</html>
