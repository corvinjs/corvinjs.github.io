  <defs
     id="defs8">
    <!-- Neon Glow Filter -->
    <filter
       id="neon-glow"
       x="-0.33278384"
       y="-0.53744529"
       width="1.6726663"
       height="2.0978619">
      <!-- Drop Shadow Color: #537c4d -->
      <feFlood
         flood-color="#537c4d"
         flood-opacity="1"
         result="flood"
         id="feFlood1" />
      <feComposite
         in="flood"
         in2="SourceAlpha"
         operator="in"
         result="mask"
         id="feComposite1" />
      <!-- Blurs for ambient shadow/glow -->
      <feGaussianBlur
         in="mask"
         stdDeviation="6"
         result="blur1"
         id="feGaussianBlur1" />
      <feGaussianBlur
         in="mask"
         stdDeviation="16"
         result="blur2"
         id="feGaussianBlur2" />
      <feGaussianBlur
         in="mask"
         stdDeviation="28"
         result="blur3"
         id="feGaussianBlur3" />
      <!-- Merge glows behind the main stroke -->
      <feMerge
         result="glow"
         id="feMerge5">
        <feMergeNode
           in="blur3"
           id="feMergeNode3" />
        <feMergeNode
           in="blur2"
           id="feMergeNode4" />
        <feMergeNode
           in="blur1"
           id="feMergeNode5" />
      </feMerge>
      <!-- Outer dark edge for contrast -->
      <feOffset
         in="mask"
         dx="4"
         dy="6"
         result="offset-shadow"
         id="feOffset5" />
      <feGaussianBlur
         in="offset-shadow"
         stdDeviation="4"
         result="shadow-blur"
         id="feGaussianBlur5" />
      <!-- Layering Shadow, Glow, and Original White Tube -->
      <feMerge
         id="feMerge8">
        <feMergeNode
           in="shadow-blur"
           id="feMergeNode6" />
        <feMergeNode
           in="glow"
           id="feMergeNode7" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode8" />
      </feMerge>
    </filter>
    <!-- Tube End Cap Styles -->
    <style
       id="style8">
      .neon-text {
      fill: none;
      stroke: #ffffff;
      stroke-width: 22;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#neon-glow);
      }
      .neon-core {
      fill: none;
      stroke: #ffffff;
      stroke-width: 30;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.3;
      filter: blur(2px);
      }
    </style>
  </defs>
